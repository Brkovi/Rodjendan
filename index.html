<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Srećan rođendan!</title>
<meta name="description" content="Da ti se ispune sve želje počevši od ove aplikacije!">
<meta name="theme-color" content="#F3E8DB">
<meta property="og:type" content="website">
<meta property="og:title" content="Srećan rođendan!">
<meta property="og:description" content="Da ti se ispune sve želje počevši od ove aplikacije!">
<meta property="og:url" content="https://raddar.rs/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%89%3C/text%3E%3C/svg%3E">
<style>
  :root {
    /* Raddar paleta — preuzeta iz prototipa */
    --bg: #F3E8DB;         /* topliji bež */
    --ink: #2A1D25;
    --ink-2: #75606B;
    --primary: #7A2E52;      /* mulberry */
    --accent: #B9852A;       /* champagne gold */
    --success: #3C7A62;      /* sage */
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    text-align: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .garden {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .garden .b {
    opacity: 0; transform-origin: 0 0;
    animation: bloom .85s cubic-bezier(.2,.8,.25,1) forwards;
  }
  @keyframes bloom {
    from { opacity: 0; transform: scale(.72); }
    to   { opacity: 1; transform: scale(1); }
  }

  .ribbons {
    position: fixed; top: 0; left: 0;
    width: 100%; height: min(46vh, 380px);
    pointer-events: none; z-index: 1;
  }
  .ribbons path {
    fill: none; stroke-linecap: round;
    transform-box: fill-box; transform-origin: 50% 0%;
  }

  #confetti {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 3;
  }

  main {
    position: relative; z-index: 2;
    max-width: min(680px, 100%);
    opacity: 0; transform: translateY(14px);
    animation: rise .9s cubic-bezier(.2,.7,.2,1) .4s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  h1 {
    margin: 0 0 20px;
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(42px, 12vw, 104px);
    line-height: 1.03;
    letter-spacing: -.025em;
    color: var(--primary);
    text-wrap: balance;
  }
  p {
    margin: 0 auto;
    max-width: 30ch;
    font-size: clamp(16px, 4.2vw, 21px);
    line-height: 1.5;
    color: var(--ink-2);
    text-wrap: balance;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-2.2deg); }
    50%      { transform: rotate(2.2deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; opacity: 1; transform: none; }
    .ribbons path { animation: none !important; stroke-dashoffset: 0 !important; }
    .garden .b { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<svg class="garden" id="garden" aria-hidden="true"></svg>

<svg class="ribbons" id="ribbons" aria-hidden="true" preserveAspectRatio="xMidYMin slice"></svg>
<canvas id="confetti" aria-hidden="true"></canvas>

<main>
  <h1>Srećan rođendan!</h1>
  <p>Da ti se ispune sve želje počevši od ove aplikacije!</p>
</main>

<script>
(function () {
  var REDUCED = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CONFETTI = ['#7A2E52', '#611F41', '#B9852A', '#3C7A62', '#8A2F5B', '#C9AEA6'];
  var RIBBON   = ['#7A2E52', '#B9852A', '#3C7A62', '#8A2F5B', '#C9AEA6'];

  /* ---------- trake ---------- */
  var svg = document.getElementById('ribbons');

  function ribbonPath(x, len) {
    var d = 'M ' + x + ' 0', y = 0,
        dir = Math.random() < .5 ? 1 : -1,
        amp = 13 + Math.random() * 17,
        seg = 42;
    while (y < len) {
      var ny = Math.min(y + seg, len);
      d += ' Q ' + (x + dir * amp) + ' ' + ((y + ny) / 2) + ' ' + x + ' ' + ny;
      dir *= -1; y = ny;
    }
    return d;
  }

  function drawRibbons(animate) {
    var w = window.innerWidth,
        h = Math.min(window.innerHeight * .46, 380),
        n = Math.max(3, Math.min(7, Math.round(w / 230)));

    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    for (var i = 0; i < n; i++) {
      var x   = (w / n) * (i + .5) + (Math.random() - .5) * (w / n) * .55,
          len = h * (.30 + Math.random() * .34),
          p   = document.createElementNS('http://www.w3.org/2000/svg', 'path');

      p.setAttribute('d', ribbonPath(x, len));
      p.setAttribute('stroke', RIBBON[i % RIBBON.length]);
      p.setAttribute('stroke-width', (3 + Math.random() * 3).toFixed(1));
      p.setAttribute('opacity', (.42 + Math.random() * .28).toFixed(2));
      svg.appendChild(p);

      if (animate && !REDUCED) {
        var L = p.getTotalLength();
        p.style.strokeDasharray  = L;
        p.style.strokeDashoffset = L;
        p.style.transition = 'stroke-dashoffset .95s cubic-bezier(.2,.75,.25,1) ' +
                             (i * .07).toFixed(2) + 's';
        /* jedan frame da se transition zakači */
        (function (el) { requestAnimationFrame(function () {
          requestAnimationFrame(function () { el.style.strokeDashoffset = 0; });
        }); })(p);
      }
      if (!REDUCED) {
        p.style.animation = 'sway ' + (3.6 + Math.random() * 2.4).toFixed(2) +
                            's ease-in-out ' + (Math.random() * 2).toFixed(2) +
                            's infinite';
      }
    }
  }

  drawRibbons(true);

  /* ---------- cveće ---------- */
  var BLOOM = ['#7A2E52', '#8A2F5B', '#A8506F', '#C2738D', '#C9AEA6', '#E6D9D4'];
  var LEAFC = ['#3C7A62', '#4E8A70', '#65997F', '#2F6350'];
  var BERRY = ['#611F41', '#8A2F5B', '#B9852A'];
  var GOLD  = '#B9852A';
  function pick(a) { return a[(Math.random() * a.length) | 0]; }

  function fBloom(col, r) {
    var g = '', n = 5, i;
    for (i = 0; i < n; i++) {
      g += '<path d="M0 0 C ' + (-r * .30) + ' ' + (-r * .36) + ' ' + (-r * .26) + ' ' + (-r * .82) +
           ' 0 ' + (-r) + ' C ' + (r * .26) + ' ' + (-r * .82) + ' ' + (r * .30) + ' ' + (-r * .36) +
           ' 0 0 Z" fill="' + col + '" transform="rotate(' + (i * 360 / n) + ')"/>';
    }
    return g + '<circle r="' + (r * .17).toFixed(1) + '" fill="' + GOLD + '"/>';
  }

  function fLeaf(col, L) {
    return '<path d="M0 0 C ' + (L * .30) + ' ' + (-L * .26) + ' ' + (L * .30) + ' ' + (-L * .72) +
           ' 0 ' + (-L) + ' C ' + (-L * .30) + ' ' + (-L * .72) + ' ' + (-L * .30) + ' ' + (-L * .26) +
           ' 0 0 Z" fill="' + col + '"/>' +
           '<path d="M0 0 L 0 ' + (-L * .9) + '" stroke="rgba(255,255,255,.3)" fill="none" stroke-width="' +
           (L * .05).toFixed(2) + '"/>';
  }

  function fSprig(col, L) {
    var g = '<path d="M0 0 Q ' + (L * .1) + ' ' + (-L * .5) + ' 0 ' + (-L) + '" stroke="' + col +
            '" stroke-width="' + (L * .035).toFixed(2) + '" fill="none" stroke-linecap="round"/>',
        n = 5 + ((Math.random() * 3) | 0), i;
    for (i = 1; i <= n; i++) {
      var t = i / (n + 1), y = -L * t, sz = L * .26 * (1 - t * .45);
      g += '<g transform="translate(0 ' + y.toFixed(1) + ')">' +
           '<path d="M0 0 C ' + (sz * .5) + ' ' + (-sz * .3) + ' ' + sz + ' ' + (-sz * .2) + ' ' + (sz * 1.1) +
           ' ' + (sz * .18) + ' C ' + (sz * .6) + ' ' + (sz * .3) + ' ' + (sz * .2) + ' ' + (sz * .2) +
           ' 0 0 Z" fill="' + col + '"/>' +
           '<path d="M0 0 C ' + (-sz * .5) + ' ' + (-sz * .3) + ' ' + (-sz) + ' ' + (-sz * .2) + ' ' + (-sz * 1.1) +
           ' ' + (sz * .18) + ' C ' + (-sz * .6) + ' ' + (sz * .3) + ' ' + (-sz * .2) + ' ' + (sz * .2) +
           ' 0 0 Z" fill="' + col + '"/></g>';
    }
    return g;
  }

  function fBerry(col, L) {
    var g = '<path d="M0 0 Q ' + (L * .12) + ' ' + (-L * .4) + ' 0 ' + (-L * .72) + '" stroke="#4E8A70" fill="none" stroke-width="' +
            (L * .05).toFixed(2) + '" stroke-linecap="round"/>',
        n = 2 + ((Math.random() * 3) | 0), i;
    for (i = 0; i < n; i++) {
      g += '<ellipse cx="' + ((Math.random() - .5) * L * .5).toFixed(1) + '" cy="' +
           (-L * (.45 + Math.random() * .5)).toFixed(1) + '" rx="' + (L * .12).toFixed(1) +
           '" ry="' + (L * .15).toFixed(1) + '" fill="' + col + '"/>';
    }
    return g;
  }

  function fBud(col, L) {
    return '<path d="M0 0 L 0 ' + (-L * .55) + '" stroke="#4E8A70" fill="none" stroke-width="' +
           (L * .055).toFixed(2) + '" stroke-linecap="round"/>' +
           '<path d="M0 ' + (-L * .5) + ' C ' + (L * .2) + ' ' + (-L * .62) + ' ' + (L * .18) + ' ' + (-L * .95) +
           ' 0 ' + (-L) + ' C ' + (-L * .18) + ' ' + (-L * .95) + ' ' + (-L * .2) + ' ' + (-L * .62) +
           ' 0 ' + (-L * .5) + ' Z" fill="' + col + '"/>';
  }

  var garden = document.getElementById('garden');

  function drawGarden() {
    var w = window.innerWidth, h = window.innerHeight;
    garden.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

    /* stvarni raspon slova, ne širina bloka — Range hvata prelomljene redove */
    function textBox(sel) {
      var r = document.createRange();
      r.selectNodeContents(document.querySelector(sel));
      return r.getBoundingClientRect();
    }
    var t1 = textBox('h1'), t2 = textBox('main p'),
        m = {
          left:   Math.min(t1.left,   t2.left),
          right:  Math.max(t1.right,  t2.right),
          top:    Math.min(t1.top,    t2.top),
          bottom: Math.max(t1.bottom, t2.bottom)
        },
        px = Math.max(26, w * .045), py = Math.max(24, h * .035),
        sl = m.left - px, sr = m.right + px, st = m.top - py, sb = m.bottom + py,
        cx = w / 2, cy = h / 2,
        band = Math.min(w, h) * .22,
        out = [];

    /* sidra duž oboda, gurnuta malo ka unutra — gušće u uglovima */
    var per = 2 * (w + h),
        nAnchors = Math.round(Math.min(42, Math.max(18, per / 155)));

    function anchor(t, deep) {
      var x, y;
      if (t < w)             { x = t;              y = 0; }
      else if (t < w + h)    { x = w;              y = t - w; }
      else if (t < 2*w + h)  { x = w - (t - w - h); y = h; }
      else                   { x = 0;              y = h - (t - 2*w - h); }
      var dx = cx - x, dy = cy - y, d = Math.sqrt(dx*dx + dy*dy) || 1;
      var depth = Math.pow(Math.random(), 1.6) * band * (deep ? 1 : .55);
      return { x: x + dx / d * depth, y: y + dy / d * depth };
    }

    function emit(x, y, R, el) {
      if (x + R > sl && x - R < sr && y + R > st && y - R < sb) return;
      if (x < -R || x > w + R || y < -R || y > h + R) return;
      out.push('<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' +
               ((Math.random() * 360) | 0) + ') scale(' + (.9 + Math.random() * .38).toFixed(2) + ')">' +
               '<g class="b" style="animation-delay:' + (Math.random() * .6).toFixed(2) + 's">' +
               el + '</g></g>');
    }

    for (var i = 0; i < nAnchors; i++) {
      var a = anchor((i / nAnchors + Math.random() * .6 / nAnchors) * per, true),
          spread = 34 + Math.random() * 46,
          n = 4 + ((Math.random() * 4) | 0);

      /* nosilac grozda — krupan cvet */
      var Rm = 21 + Math.random() * 15;
      emit(a.x, a.y, Rm, fBloom(pick(BLOOM), Rm));

      for (var k = 0; k < n; k++) {
        var ang = Math.random() * Math.PI * 2,
            rad = spread * (.35 + Math.random() * .85),
            x = a.x + Math.cos(ang) * rad,
            y = a.y + Math.sin(ang) * rad,
            r = Math.random(), R, el;

        if      (r < .20) { R = 10 + Math.random() * 10; el = fBloom(pick(BLOOM), R); }
        else if (r < .46) { R = 24 + Math.random() * 22; el = fLeaf(pick(LEAFC), R); }
        else if (r < .74) { R = 34 + Math.random() * 30; el = fSprig(pick(LEAFC), R); }
        else if (r < .89) { R = 24 + Math.random() * 18; el = fBerry(pick(BERRY), R); }
        else              { R = 20 + Math.random() * 15; el = fBud(pick(BLOOM), R); }
        emit(x, y, R, el);
      }
    }

    /* sitno punjenje po samoj ivici, da ram nema rupa */
    var fill = Math.round(nAnchors * 2.2);
    for (var j = 0; j < fill; j++) {
      var b = anchor(Math.random() * per, false),
          r2 = Math.random(), R2, el2;
      if      (r2 < .34) { R2 =  8 + Math.random() *  9; el2 = fBloom(pick(BLOOM), R2); }
      else if (r2 < .70) { R2 = 18 + Math.random() * 16; el2 = fLeaf(pick(LEAFC), R2); }
      else               { R2 = 26 + Math.random() * 20; el2 = fSprig(pick(LEAFC), R2); }
      emit(b.x, b.y, R2, el2);
    }

    garden.innerHTML = out.join('');
  }

  drawGarden();


  /* ---------- konfete ---------- */
  var canvas = document.getElementById('confetti'),
      ctx = canvas.getContext('2d'),
      P = [], W = 0, H = 0, running = false, last = 0;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();

  function piece(o) {
    return {
      x: o.x, y: o.y,
      vx: o.vx, vy: o.vy, g: o.g,
      w: 5 + Math.random() * 7,
      h: 8 + Math.random() * 12,
      color: CONFETTI[(Math.random() * CONFETTI.length) | 0],
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - .5) * .25,
      phase: Math.random() * Math.PI * 2,
      wob: .9 + Math.random() * 1.9,
      amp: 10 + Math.random() * 26
    };
  }

  function rain(n) {
    if (P.length > 340) return;
    for (var i = 0; i < n; i++) P.push(piece({
      x: Math.random() * W,
      y: -24 - Math.random() * H * .85,
      vx: (Math.random() - .5) * 34,
      vy: 60 + Math.random() * 95,
      g: 10
    }));
  }

  function burst(cx, cy, n) {
    if (P.length > 380) return;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2,
          s = 190 + Math.random() * 330;
      P.push(piece({
        x: cx, y: cy,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 130,
        g: 560
      }));
    }
  }

  function frame(t) {
    if (!last) last = t;
    var dt = Math.min((t - last) / 1000, .05);
    last = t;

    ctx.clearRect(0, 0, W, H);

    for (var i = P.length - 1; i >= 0; i--) {
      var p = P[i];
      p.vy += p.g * dt;
      p.phase += p.wob * dt;
      p.y += p.vy * dt;
      p.x += (p.vx + Math.sin(p.phase) * p.amp) * dt;
      p.rot += p.vr * dt * 60;

      if (p.y - p.h > H + 30) { P.splice(i, 1); continue; }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(Math.cos(p.phase), 1);   /* lepršanje */
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }

    if (P.length) requestAnimationFrame(frame);
    else { running = false; last = 0; }
  }

  function start() {
    if (running) return;
    running = true; last = 0;
    requestAnimationFrame(frame);
  }

  if (!REDUCED) {
    rain(95);
    start();

    setTimeout(function () { burst(W / 2, H * .42, 80); start(); }, 700);

    /* kratko dosipanje pa se smiri */
    var trickle = setInterval(function () { rain(3); start(); }, 420);
    setTimeout(function () { clearInterval(trickle); }, 6500);

    /* dodirni bilo gde za još */
    window.addEventListener('pointerdown', function (e) {
      burst(e.clientX, e.clientY, 55);
      start();
    });
  }

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { resize(); drawRibbons(false); drawGarden(); }, 180);
  });
})();
</script>
</body>
</html>
